name: CI

on: push

jobs:
  lint:
    name: Lint the code with flake8
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[tests]"

      - name: Run ruff checks
        if: ${{ !cancelled() }}
        run: ruff check src tests

      - name: Run Flake8 with pydoclint
        if: ${{ !cancelled() }}
        run: flake8 src tests


  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pypa/build
        run: python3 -m pip install build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/


  test-build:
    name: Test build and execution on (${{ matrix.os }} - ${{ matrix.python-version }})
    needs:
    - build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python (${{ matrix.python-version }})
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install test dependencies
        shell: bash
        run: python -m pip install .[tests]

      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Run tests
        # The SITL tests need PX4, which runs in the sitl job. Coverage is only checked there, with all tests.
        run: pytest -m "not sitl" --cov-fail-under=0

  sitl:
    name: Pipeline tests with PX4 SITL and coverage check
    needs:
    - build
    runs-on: ubuntu-24.04
    env:
      PX4_VERSION: v1.17.0
      # Outside of the repository checkout, so pytest and the linters don't pick up PX4's own files
      PX4_DIR: /home/runner/px4

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Restore PX4 SITL build
        id: px4-cache
        uses: actions/cache/restore@v6
        with:
          # Only the binaries and startup files are needed to run PX4, not the sources
          path: |
            /home/runner/px4/build/px4_sitl_default/bin
            /home/runner/px4/build/px4_sitl_default/etc
          key: px4-sitl-${{ env.PX4_VERSION }}-ubuntu-24.04

      - name: Build PX4 SITL
        if: steps.px4-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$PX4_VERSION" --recurse-submodules --shallow-submodules \
            https://github.com/PX4/PX4-Autopilot.git "$PX4_DIR"
          bash "$PX4_DIR/Tools/setup/ubuntu.sh" --no-nuttx --no-sim-tools
          make -C "$PX4_DIR" px4_sitl_default

      - name: Save PX4 SITL build
        # Saved right away, so the build is cached even if the tests fail afterwards
        if: steps.px4-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            /home/runner/px4/build/px4_sitl_default/bin
            /home/runner/px4/build/px4_sitl_default/etc
          key: px4-sitl-${{ env.PX4_VERSION }}-ubuntu-24.04

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install test dependencies and wheel
        run: |
          python -m pip install .[tests]
          python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Run all tests, including SITL, with the coverage check
        run: pytest

      - name: Upload logs and coverage
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sitl-logs
          path: |
            coverage.json
            ~/Documents/DroneManager/Logs

  check:
    # this provides a single status check for branch merge rules
    # (use this in `Require status checks to pass before merging` in branch settings)
    if: always()
    needs:
      - lint
      - test-build
      - sitl
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
