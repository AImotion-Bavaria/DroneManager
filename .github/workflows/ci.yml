name: CI

on: push

jobs:
  lint:
    name: Lint the code with flake8
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install ".[tests]"

      - name: Run ruff checks
        if: ${{ !cancelled() }}
        run: ruff check src tests

      - name: Run Flake8 with pydoclint
        if: ${{ !cancelled() }}
        run: flake8 src tests


  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pypa/build
        run: python3 -m pip install build

      - name: Build a binary wheel and a source tarball
        run: python3 -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/


  test-build:
    name: Test build and execution on (${{ matrix.os }} - ${{ matrix.python-version }})
    needs:
    - build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
      fail-fast: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python (${{ matrix.python-version }})
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Install test dependencies
        shell: bash
        run: python -m pip install .[tests]

      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Run tests
        run: pytest

  check:
    # this provides a single status check for branch merge rules
    # (use this in `Require status checks to pass before merging` in branch settings)
    if: always()
    needs:
      - lint
      - test-build
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
